<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Streamora | عالمك الترفيهي</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#09090d;color:white;font-family:Arial,sans-serif}
header{padding:20px 5%;display:flex;align-items:center;gap:20px;background:#111;position:sticky;top:0;z-index:5}
.logo{color:#e50914;font-size:25px;font-weight:bold}
input{padding:11px;border:1px solid #444;border-radius:7px;background:#222;color:white;min-width:0}
header input{margin-right:auto;width:45%;max-width:280px}
.hero{padding:65px 6%;background:linear-gradient(90deg,#09090d,#30152c,#09090d)}
.hero h1{font-size:clamp(32px,6vw,55px);margin:10px 0}
.hero p{color:#ddd;line-height:1.8;max-width:520px}
button{padding:11px 17px;border:0;border-radius:6px;cursor:pointer;font-weight:bold}
.play{background:white;color:#111}
.secondary{background:#333;color:white}
section{padding:22px 5%}
h2{font-size:21px}
.movies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.movie{background:#191920;border-radius:10px;overflow:hidden}
.poster{height:155px;display:flex;align-items:end;padding:12px;font-size:20px;font-weight:bold;background:linear-gradient(135deg,#43305c,#bc4a64)}
.movie:nth-child(2) .poster{background:linear-gradient(135deg,#102d53,#4289a9)}
.movie:nth-child(3) .poster{background:linear-gradient(135deg,#6b2d25,#d99a54)}
.movie:nth-child(4) .poster{background:linear-gradient(135deg,#183e2b,#87a75b)}
.info{padding:12px}
.info p{color:#bbb;font-size:13px;line-height:1.6}
.info button{width:100%;margin-top:5px}
#playerBox{display:none;position:fixed;inset:0;background:#000e;z-index:10;align-items:center;justify-content:center;padding:15px}
.playerContent{background:#17171d;padding:15px;border-radius:10px;width:min(850px,100%)}
video{width:100%;max-height:65vh;background:#000}
.playerTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
footer{padding:25px;text-align:center;color:#aaa;font-size:13px}
@media(max-width:650px){.movies{grid-template-columns:repeat(2,minmax(0,1fr))}header{gap:12px;padding:15px 4%}.logo{font-size:20px}.poster{height:135px}.hero{padding:50px 5%}}
</style>
</head>
<body>

<header>
  <div class="logo">STREAMORA</div>
  <input id="search" placeholder="ابحث عن فيلم..." oninput="render()">
</header>

<div class="hero">
  <p style="color:#e8c77a">عالمك الترفيهي</p>
  <h1>حكايات تستحق المشاهدة</h1>
  <p>اكتشف أفلامًا وقصصًا جديدة في تجربة مشاهدة بسيطة وأنيقة.</p>
  <button class="play" onclick="watch(0)">▶️ شاهد الآن</button>
  <button class="secondary" onclick="document.getElementById('library').scrollIntoView()">استكشف المكتبة</button>
</div>

<section id="library">
  <h2>مختارات لك</h2>
  <div class="movies" id="movies"></div>
</section>

<div id="playerBox">
  <div class="playerContent">
    <div class="playerTop">
      <strong id="videoTitle">مشغّل الفيديو</strong>
      <button class="secondary" onclick="closePlayer()">إغلاق ✕</button>
    </div>
    <video id="video" controls playsinline></video>
    <p style="color:#bbb;font-size:13px">
      استبدل رابط الفيديو بفيديو تملك حق عرضه.
    </p>
  </div>
</div>

<footer>
  Streamora ©️ 2026 — مشروع مستقل تجريبي، غير تابع إلى Netflix.
</footer>

<script>
const demoVideo =
"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";

const catalog = [
 {title:"رحلة الألوان",genre:"وثائقي",desc:"اكتشف جمال الطبيعة."},
 {title:"خلف الأفق",genre:"مغامرة",desc:"رحلة إلى المجهول."},
 {title:"يوميات المدينة",genre:"دراما",desc:"حكايات من المدينة."},
 {title:"الكوكب الأزرق",genre:"طبيعة",desc:"جمال عالمنا الطبيعي."}
];

let favorites = JSON.parse(localStorage.getItem("streamoraFav") || "[]");

function render(){
 const q=document.getElementById("search").value.trim().toLowerCase();
 const list=document.getElementById("movies");
 list.innerHTML="";

 catalog.forEach((m,i)=>{
   if(!(m.title+" "+m.genre).toLowerCase().includes(q)) return;

   const card=document.createElement("article");
   card.className="movie";
   card.innerHTML=`
     <div class="poster">${m.title}</div>
     <div class="info">
       <strong>${m.title}</strong>
       <p>${m.genre} · ${m.desc}</p>
       <button class="play" onclick="watch(${i})">▶️ تشغيل</button>
       <button class="secondary" onclick="favorite(${i})">
       ${favorites.includes(i)?"♥️ محفوظ":"＋ المفضلة"}
       </button>
     </div>`;
   list.appendChild(card);
 });
}

function watch(index){
 const m=catalog[index];
 document.getElementById("videoTitle").textContent=m.title;
 document.getElementById("playerBox").style.display="flex";
 const video=document.getElementById("video");
 video.src=demoVideo;
 video.load();
 video.play().catch(()=>{});
}

function closePlayer(){
 const video=document.getElementById("video");
 video.pause();
 video.removeAttribute("src");
 video.load();
 document.getElementById("playerBox").style.display="none";
}

function favorite(index){
 favorites=favorites.includes(index)
 ?favorites.filter(i=>i!==index)
 :[...favorites,index];
 localStorage.setItem("streamoraFav",JSON.stringify(favorites));
 render();
}

render();
</script>
</body>
</html>
