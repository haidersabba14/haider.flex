<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111">
<title>HAIDER FLEX</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:white;font-family:Arial,sans-serif}
header{background:#191919;padding:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.logo{font-size:25px;color:#e50914;font-weight:bold;margin-left:auto}
button,input,select{padding:11px;border:0;border-radius:5px;font-size:14px}
button{cursor:pointer;background:#333;color:white;margin:3px}
button.red{background:#e50914}
.hero{padding:45px 6%;background:linear-gradient(90deg,#111,#501015);min-height:230px}
main{padding:20px 5%}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}
input,select{background:#292929;color:white}.tools input{flex:1;min-width:150px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:#242424;border-radius:7px;overflow:hidden}
.poster{height:170px;display:grid;place-items:center;font-size:55px;background:linear-gradient(135deg,#66131a,#282828)}
.info{padding:12px}.info h3{margin:4px 0 10px}.muted{color:#bbb;font-size:13px}
section.panel{background:#222;padding:18px;margin-top:15px;border-radius:7px}
.hidden{display:none!important}
dialog{background:#222;color:white;border:1px solid #555;border-radius:8px;max-width:90%;width:420px}
dialog input{display:block;width:100%;margin:10px 0}
video{width:100%;background:#000}
</style>
</head>
<body>
<header>
<div class="logo">HAIDER FLEX</div>
<button onclick="showPage('home')">الرئيسية</button>
<button onclick="showPage('فيلم')">أفلام</button>
<button onclick="showPage('مسلسل')">مسلسلات</button>
<button onclick="showPage('list')">قائمتي ♥️</button>
<button onclick="login()">حسابي</button>
</header>

<div class="hero">
<h1>عالم الترفيه بين يديك</h1>
<p>أفلام ومسلسلات في مكان واحد.</p>
<button class="red" onclick="document.getElementById('catalog').scrollIntoView()">استكشف الآن</button>
</div>

<main id="catalog">
<div class="tools">
<input id="search" placeholder="ابحث عن فيلم أو مسلسل..." oninput="render()">
<select id="genre" onchange="render()">
<option value="">كل التصنيفات</option>
<option>أكشن</option><option>دراما</option><option>كوميديا</option><option>خيال علمي</option>
</select>
<button onclick="showPage('history')">سجل المشاهدة</button>
<button onclick="showPage('subscription')">الاشتراكات</button>
</div>
<h2 id="heading">المحتوى</h2>
<div id="cards" class="cards"></div>
<div id="extra" class="panel hidden"></div>
</main>

<dialog id="account">
<h2>حساب تجريبي</h2>
<input id="username" placeholder="اسم المستخدم">
<p class="muted">هذا تسجيل تجريبي على هذا الجهاز، وليس حسابًا حقيقيًا.</p>
<button class="red" onclick="saveUser()">دخول</button>
<button onclick="document.getElementById('account').close()">إغلاق</button>
</dialog>

<dialog id="watch">
<h2 id="watchTitle">المشاهدة</h2>
<video id="player" controls playsinline></video>
<p id="videoMessage" class="muted"></p>
<button onclick="nextMovie()">التالي ⏭</button>
<button onclick="closePlayer()">إغلاق</button>
</dialog>

<script>
const movies=[
{id:1,title:"رحلة المجهول",type:"فيلم",genre:"أكشن",year:2025,emoji:"🚀",desc:"مغامرة مشوقة"},
{id:2,title:"مدينة الظلال",type:"مسلسل",genre:"دراما",year:2025,emoji:"🌆",desc:"أسرار المدينة"},
{id:3,title:"ما وراء النجوم",type:"فيلم",genre:"خيال علمي",year:2024,emoji:"🌌",desc:"رحلة إلى الفضاء"},
{id:4,title:"يوميات مضحكة",type:"مسلسل",genre:"كوميديا",year:2024,emoji:"🎭",desc:"مواقف مضحكة"},
{id:5,title:"كوكبنا الجميل",type:"فيلم",genre:"وثائقي",year:2025,emoji:"🌍",desc:"روائع الطبيعة"}
];
let currentPage="home",currentMovie=null;
const $=id=>document.getElementById(id);
const read=k=>{try{return JSON.parse(localStorage.getItem("hf_"+k)||"[]")}catch(e){return []}};
const write=(k,v)=>localStorage.setItem("hf_"+k,JSON.stringify(v));

function render(){
 let arr=movies.filter(m=>
 (! $("search").value||m.title.includes($("search").value))&&
 (!$("genre").value||m.genre===$("genre").value)&&
 (currentPage==="home"||currentPage==="history"||currentPage==="list"||m.type===currentPage)
 );
 if(currentPage==="history")arr=movies.filter(m=>read("history").includes(m.id));
 if(currentPage==="list")arr=movies.filter(m=>read("list").includes(m.id));
 $("heading").textContent={home:"اكتشف المحتوى",فيلم:"الأفلام",مسلسل:"المسلسلات",history:"سجل المشاهدة",list:"قائمتي"}[currentPage]||"المحتوى";
 $("cards").innerHTML=arr.map(m=>`
 <div class="card">
 <div class="poster">${m.emoji}</div>
 <div class="info"><h3>${m.title}</h3>
 <p class="muted">${m.type} • ${m.year}</p>
 <p class="muted">${m.desc}</p>
 <button class="red" onclick="playMovie(${m.id})">▶️ مشاهدة</button>
 <button onclick="toggleList(${m.id})">♥️ حفظ</button>
 </div></div>`).join("")||"<p>لا توجد نتائج.</p>";
}
function showPage(p){
 currentPage=p;$("extra").classList.add("hidden");$("cards").classList.remove("hidden");
 if(p==="subscription"){
  $("cards").classList.add("hidden");$("extra").classList.remove("hidden");
  $("heading").textContent="الاشتراكات";
  $("extra").innerHTML="<h3>الباقة المجانية</h3><p>تصفح المحتوى التجريبي.</p><p class='muted'>الدفع وتجديد الاشتراكات غير مفعّلين في هذا الإصدار.</p>";
 }else render();
}
function toggleList(id){
 let a=read("list");
 write("list",a.includes(id)?a.filter(x=>x!==id):[...a,id]);
 alert("تم تحديث قائمتك على هذا الجهاز.");render();
}
function playMovie(id){
 currentMovie=movies.find(m=>m.id===id);
 $("watchTitle").textContent=currentMovie.title;
 $("player").removeAttribute("src");
 $("videoMessage").textContent="هذا المحتوى تجريبي. أضف رابط فيديو تملك حق عرضه لتشغيله.";
 $("watch").showModal();
 let a=read("history");write("history",[id,...a.filter(x=>x!==id)]);
}
function nextMovie(){
 let i=movies.findIndex(m=>m.id===currentMovie?.id);
 if(i>=0&&i<movies.length-1)playMovie(movies[i+1].id);
 else alert("لا يوجد محتوى تالٍ.");
}
function closePlayer(){$("player").pause();$("watch").close()}
function login(){$("account").showModal()}
function saveUser(){
 let n=$("username").value.trim();
 if(!n)return alert("اكتب اسم المستخدم.");
 localStorage.setItem("hf_username",n);
 $("account").close();alert("أهلًا "+n); 
}
render();
</script>
</body>
</html>
